; PlatformIO project config -- alternatif dari Arduino IDE.
; Buka folder ini di VS Code + PlatformIO, lalu Build/Upload.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Encoder
    adafruit/Adafruit_VL53L0X
    bodmer/TFT_eSPI
    ottowinter/ESPAsyncWebServer-esphome
    ottowinter/AsyncTCP-esphome
; Catatan: TFT_eSPI perlu User_Setup.h. Cara paling mudah di PlatformIO:
; tambahkan build_flags -D sesuai layar, mis. untuk ILI9341:
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=40000000
